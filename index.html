<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>新闻联播文字稿存档</title>
		<meta name="description" content="每日《新闻联播》完整文字稿存档，晚间自动更新。">
		<link rel="icon" href="web/favicon.svg" type="image/svg+xml">
		<link rel="stylesheet" href="web/site.css">
	</head>
	<body>
		<header class="topbar">
			<div class="topbar-inner">
				<div class="brand">
					<span class="brand-logo" aria-hidden="true">联</span>
					<div>
						<div class="brand-name">新闻联播文字稿</div>
						<div class="brand-sub">央视《新闻联播》完整文字稿存档</div>
					</div>
				</div>
				<div class="topbar-meta" id="topMeta">加载中…</div>
			</div>
		</header>

		<section class="hero">
			<div class="hero-copy">
				<p class="hero-eyebrow">每日 19:00 播出 · 晚间自动更新</p>
				<h1>新闻联播<span class="thin">文字稿</span></h1>
				<p class="hero-sub" id="heroSub">加载中…</p>
				<div class="hero-stats" id="heroStats"></div>
			</div>
			<aside class="hero-card" id="heroCard">
				<div class="hero-card-head">
					<span class="badge-latest">最新</span>
					<time id="cardDate">…</time>
				</div>
				<p class="card-abs" id="cardAbs">加载中…</p>
				<a class="btn" id="cardBtn" href="#">阅读本期全文 <span aria-hidden="true">→</span></a>
			</aside>
		</section>

		<div class="search-wrap">
			<div class="search-box">
				<div class="search-scope" role="tablist" aria-label="搜索类型">
					<button type="button" class="scope-btn active" data-mode="date" role="tab" aria-selected="true">日期</button>
					<button type="button" class="scope-btn" data-mode="content" role="tab" aria-selected="false">内容</button>
				</div>
				<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
					<circle cx="11" cy="11" r="7"></circle>
					<line x1="21" y1="21" x2="16.5" y2="16.5"></line>
				</svg>
				<input id="search" type="search" placeholder="按日期搜索，如 20260810 / 8月10日 / 2026-08-10"
					autocomplete="off">
			</div>
			<p class="search-result hidden" id="searchResult"></p>
		</div>

		<main id="list">
			<p class="state-msg">加载中…</p>
		</main>

		<footer class="site-footer">
			<div class="site-footer-inner">
				<span>文字稿数据来源：央视网《新闻联播》节目</span>
				<span>本页为个人学习存档，不代表官方立场</span>
			</div>
		</footer>

		<script>
			// ─────────── 工具 ───────────

			const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

			// YYYYMMDD -> {year, month, day, label, weekday, key}
			const parseDate = d => {
				if (!/^\d{8}$/.test(d)) return null;
				const y = +d.slice(0, 4), m = +d.slice(4, 6), day = +d.slice(6, 8);
				return {
					year: y, month: m, day,
					label: `${m}月${day}日`,
					weekday: WEEKDAYS[new Date(y, m - 1, day).getDay()],
					key: d
				};
			};

			// 摘要: 多行 -> 单行, 截断
			const summarize = (abs, max) => {
				const flat = (abs || '').replace(/\s*\n\s*/g, ' ').trim();
				return flat.length > max ? flat.slice(0, max) + '…' : flat;
			};

			// 关键词高亮: 按命中位置切分, 匹配段包 <mark>, 纯 DOM 操作防注入
			const appendHighlighted = (el, text, q) => {
				if (!q) { el.appendChild(document.createTextNode(text)); return; }
				const lt = text.toLowerCase(), lq = q.toLowerCase();
				let i = 0;
				for (;;) {
					const at = lt.indexOf(lq, i);
					if (at < 0) { el.appendChild(document.createTextNode(text.slice(i))); return; }
					if (at > i) el.appendChild(document.createTextNode(text.slice(i, at)));
					const mk = document.createElement('mark');
					mk.className = 'hl';
					mk.textContent = text.slice(at, at + lq.length);
					el.appendChild(mk);
					i = at + lq.length;
				}
			};

			// 搜索时重写可见条目的摘要行: 提要命中 -> 高亮提要;
			// 仅正文命中 -> 用年份分片全文截"命中处前后"摘要 (ft-snippet 样式区分)
			const applyHighlights = lq => {
				document.querySelectorAll('main li[data-date]').forEach(li => {
					const abs = li.querySelector('.news-abs');
					if (!abs) return;
					const item = allItems[+li.dataset.idx];
					abs.textContent = '';
					abs.classList.remove('ft-snippet');
					if (!lq || !item) {
						abs.appendChild(document.createTextNode(summarize(item && item.abstract, 60)));
						return;
					}
					const flat = (item.abstract || '').replace(/\s*\n\s*/g, ' ').trim();
					if (flat.toLowerCase().includes(lq)) {
						appendHighlighted(abs, flat.slice(0, 80), lq);
						return;
					}
					const shard = fullTextCache[item.date.slice(0, 4)] || [];
					const full = shard.find(x => x.d === item.date);
					const text = full ? full.t.replace(/\s+/g, ' ') : '';
					const at = text.toLowerCase().indexOf(lq);
					if (at >= 0) {
						const s = (at > 40 ? '…' : '') + text.slice(Math.max(0, at - 40), at + 90) + '…';
						abs.classList.add('ft-snippet');
						appendHighlighted(abs, s, lq);
					} else {
						abs.appendChild(document.createTextNode(summarize(item.abstract, 60)));
					}
				});
			};

			// 日期可搜索文本: 各种日期写法
			const dateText = item => {
				const d = parseDate(item.date);
				return `${item.date} ${d.year}年${d.month}月${d.day}日 ${d.label}`.toLowerCase();
			};

			// 内容可搜索文本: 完整摘要 (含全部新闻标题)
			const contentText = item =>
				(item.abstract || '').replace(/\s*\n\s*/g, ' ').toLowerCase();

			// ─────────── 渲染 ───────────

			let allItems = [];
			let dateIndex = [];
			let contentIndex = [];
			let searchMode = 'date'; // 'date' | 'content'

			const renderHero = json => {
				const latest = parseDate(json[0].date);
				const earliest = parseDate(json[json.length - 1].date);

				document.getElementById('topMeta').innerHTML =
					`共 <strong>${json.length}</strong> 期 · 最新 <strong>${latest.label}</strong>`;

				document.getElementById('heroSub').textContent =
					`自 ${earliest.year} 年 ${earliest.month} 月起至今，完整收录 ${json.length} 期《新闻联播》文字稿，每晚自动更新。`;

				document.getElementById('heroStats').innerHTML = `
					<div class="stat"><strong>${json.length}</strong><span>期存档</span></div>
					<div class="stat"><strong>${latest.year}.${String(latest.month).padStart(2, '0')}.${String(latest.day).padStart(2, '0')}</strong><span>最新一期</span></div>
					<div class="stat"><strong>${earliest.year}.${String(earliest.month).padStart(2, '0')}.${String(earliest.day).padStart(2, '0')}</strong><span>最早一期</span></div>`;

				document.getElementById('cardDate').textContent =
					`${latest.year}年${latest.month}月${latest.day}日 · 星期${latest.weekday}`;
				document.getElementById('cardAbs').textContent = summarize(json[0].abstract, 220);
				document.getElementById('cardBtn').href = `web/view.html?date=${latest.key}`;
			};

			const renderList = json => {
				allItems = json;
				// 预计算两类搜索索引: 日期 / 内容(完整摘要)
				dateIndex = json.map(dateText);
				contentIndex = json.map(contentText);

				// 按月分组 (新 -> 旧)
				const groups = [];
				for (const item of json) {
					const d = parseDate(item.date);
					if (!d) continue;
					const key = `${d.year}年${d.month}月`;
					const last = groups[groups.length - 1];
					if (last && last.key === key) last.items.push(item);
					else groups.push({ key, items: [item] });
				}

				let html = '';
				for (const g of groups) {
					html += `<section class="month" data-month="${g.key}">
						<div class="month-head">
							<h2>${g.key}</h2>
							<span class="count">${g.items.length} 期</span>
						</div>
						<ul class="news-list">`;
					for (const item of g.items) {
						const d = parseDate(item.date);
						const abs = summarize(item.abstract, 60);
						const flag = item === json[0] ? '<span class="news-latest-flag">● 最新一期</span>' : '';
						html += `<li data-date="${item.date}" data-idx="${json.indexOf(item)}">
							<a href="web/view.html?date=${item.date}" title="${d.label}《新闻联播》文字稿">
								<span class="news-date">${d.label}</span>
								<span class="news-weekday">星期${d.weekday}</span>
								<span class="news-abs">${abs}</span>
								<span class="news-arrow">→</span>
								${flag}
							</a>
						</li>`;
					}
					html += '</ul></section>';
				}
				document.getElementById('list').innerHTML = html;
			};

			// ─────────── 搜索过滤 ───────────

			let debounceTimer = 0;

			const hideByMonths = () => {
				document.querySelectorAll('main .month').forEach(sec => {
					sec.classList.toggle('hidden', !sec.querySelector('li:not(.hidden)'));
				});
			};

		// 日期模式: 只匹配日期文本
		const doDateSearch = lq => {
			let visible = 0;
			document.querySelectorAll('main li[data-date]').forEach(li => {
				const idx = +li.dataset.idx;
				const hit = !lq || (dateIndex[idx] && dateIndex[idx].includes(lq));
				li.classList.toggle('hidden', !hit);
				li.classList.toggle('ft-only', false);
				if (hit) visible++;
			});
			hideByMonths();
			applyHighlights(''); // 日期模式不清摘要高亮
				const resultEl = document.getElementById('searchResult');
				if (lq) {
					resultEl.classList.remove('hidden');
					resultEl.textContent = visible === 0
						? '没有找到匹配的日期'
						: `找到 ${visible} 期匹配结果`;
				} else {
					resultEl.classList.add('hidden');
				}
			};

			// 内容模式: 摘要即时过滤 + 全文分片异步检索合并
			const renderContentResults = (lq, progress) => {
				let shown = 0, summaryCount = 0;
				document.querySelectorAll('main li[data-date]').forEach(li => {
					const idx = +li.dataset.idx;
					const inSummary = !lq || (contentIndex[idx] && contentIndex[idx].includes(lq));
					const inFull = lq && fullHits.has(li.dataset.date);
					const show = inSummary || inFull;
					li.classList.toggle('hidden', !show);
					// 标记"仅正文命中"(提要里没有, 正文里有)
					li.classList.toggle('ft-only', show && !inSummary);
				if (inSummary) summaryCount++;
				if (show) shown++;
			});
			hideByMonths();
			applyHighlights(lq); // 提要高亮 / 正文命中摘要
				const resultEl = document.getElementById('searchResult');
				if (lq) {
					resultEl.classList.remove('hidden');
					let text = `找到 ${shown} 期`;
					if (shown > summaryCount) {
						text += ` (提要 ${summaryCount} + 正文 ${shown - summaryCount})`;
					}
					if (progress) text += ` · ${progress}`;
					resultEl.textContent = text;
				} else {
					resultEl.classList.add('hidden');
				}
			};

			const doSearch = () => {
				const lq = document.getElementById('search').value.trim().toLowerCase();
				if (searchMode === 'date') {
					ftToken++; // 取消进行中的全文检索
					fullHits = new Set();
					doDateSearch(lq);
				} else {
					renderContentResults(lq); // 先出摘要结果
					clearTimeout(debounceTimer);
					debounceTimer = setTimeout(() => runFullText(lq), 300);
				}
			};

			// ─────────── 全文检索 (按年分片懒加载) ───────────

			const fullTextCache = {}; // 年份 -> [{d,t}]
			let ftToken = 0;          // 并发控制: 新搜索使旧任务失效
			let fullHits = new Set(); // 正文命中的日期集合

			const yearList = () => {
				const ys = new Set(allItems.map(i => i.date.slice(0, 4)));
				return [...ys].sort().reverse();
			};

			const runFullText = async lq => {
				const my = ++ftToken;
				fullHits = new Set();
				if (lq.length < 2) return; // 单字不做全文检索
				for (const y of yearList()) {
					if (ftToken !== my) return;
					if (!(y in fullTextCache)) {
						try {
							const r = await fetch(`/search/${y}.json`);
							fullTextCache[y] = r.ok ? await r.json() : null;
						} catch {
							fullTextCache[y] = null;
						}
					}
					if (ftToken !== my) return;
					const shard = fullTextCache[y] || [];
					for (const item of shard) {
						if (item.t.toLowerCase().includes(lq)) fullHits.add(item.d);
					}
					renderContentResults(lq, `全文检索中 ${y}年…`);
				}
				if (ftToken !== my) return;
				renderContentResults(lq);
			};

			// 搜索模式切换 (日期 / 内容)
			const PLACEHOLDERS = {
				date: '按日期搜索，如 20260810 / 8月10日 / 2026-08-10',
				content: '按内容搜索，如 台风 / 共同富裕 / 人工智能'
			};
			document.querySelectorAll('.scope-btn').forEach(btn => {
				btn.addEventListener('click', () => {
					document.querySelectorAll('.scope-btn').forEach(b => {
						b.classList.toggle('active', b === btn);
						b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
					});
					searchMode = btn.dataset.mode;
					const input = document.getElementById('search');
					input.placeholder = PLACEHOLDERS[searchMode];
					doSearch();
				});
			});

			document.getElementById('search').addEventListener('input', doSearch);

			// 内容搜索时点进某期, 把关键词带给文章页做正文高亮
			document.getElementById('list').addEventListener('click', e => {
				const a = e.target.closest('a[href*="view"]');
				if (!a) return;
				const lq = document.getElementById('search').value.trim();
				if (searchMode === 'content' && lq) a.href += '&q=' + encodeURIComponent(lq);
			});

			// ─────────── 加载数据 ───────────

			fetch('/news/catalogue.json')
				.then(r => {
					if (!r.ok) throw new Error('HTTP ' + r.status);
					return r.json();
				})
				.then(json => {
					if (!Array.isArray(json) || json.length === 0) throw new Error('empty');
					// 保险: 按日期降序, 不依赖 catalogue 存储顺序
					json.sort((a, b) => (a.date < b.date ? 1 : -1));
					renderHero(json);
					renderList(json);
				})
				.catch(() => {
					document.getElementById('list').innerHTML =
						'<div class="state-msg"><h2>数据加载失败</h2><p>请稍后刷新重试。</p></div>';
					document.getElementById('topMeta').textContent = '加载失败';
					document.getElementById('heroSub').textContent = '';
					document.getElementById('cardAbs').textContent = '暂时无法获取最新一期。';
				});
		</script>
	</body>
</html>
