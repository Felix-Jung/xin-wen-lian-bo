name: Update today xin wen lian bo

on:
  workflow_dispatch:
    inputs:
      date:
        description: '抓取指定日期 YYYYMMDD (留空=今天)'
        required: false
        default: ''
  schedule:
    # 东八区 (UTC+8), 所以要-8小时
    # 19:35 抓取 (新闻联播 19:30 播完, 文字稿 19:00-19:32 逐条发布)
    # 注: GitHub Actions 的 schedule 实际执行可能延迟 1-2.5h (排队),
    #     准时的 19:35 触发由 Cloudflare Worker Cron 兜底 (见仓库说明)
    - cron: '35 11 * * *'

jobs:
  update:
    name: Update today xin wen lian bo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # 手动触发时可指定日期补数据/重跑; 定时触发留空则抓今天
      - name: Fetch news
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            npm run index -- --date ${{ inputs.date }}
          else
            npm run index
          fi
      - run: git config --local user.email "github-actions[bot]@github.com"
      - run: git config --local user.name "github-actions[bot]"
      - run: git add .
      # 判空: 当天节目尚未播出 / 抓取为空时, 不会有 diff, 此时跳过 commit, 避免任务变红失败
      - name: Commit if there are changes
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "AUTO UPDATE [bot]"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi
      # 容错: push 失败不中止 job, 后面的飞书通知照常执行
      # (否则 push 失败会导致整个 job 红 + 飞书被跳过)
      - name: Push master changes
        if: env.HAS_CHANGES == 'true'
        continue-on-error: true
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
      # 推送飞书通知: 仅当今天有抓到新内容时才推送
      # continue-on-error: 推送是附加功能, 失败不应让整个 workflow 变红
      - name: Notify Feishu webhook
        if: env.HAS_CHANGES == 'true'
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node push-feishu.js
      # 同步到 Cloudflare Pages (网页版): 有新内容时自动部署; 手动触发(含纯代码改动)也部署
      # continue-on-error: 部署失败不影响数据已入库
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 pages deploy . --project-name xin-wen-lian-bo --branch master --commit-dirty=true
