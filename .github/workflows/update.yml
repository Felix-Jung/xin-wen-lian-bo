name: Update today xin wen lian bo

on:
  workflow_dispatch:
    inputs:
      date:
        description: '抓取指定日期 YYYYMMDD (留空=今天)'
        required: false
        default: ''
  # schedule 已退役: 由 CF Worker xwlb-crawler 准点触发 dispatch (19:35 起)

jobs:
  update:
    name: Update today xin wen lian bo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Fetch news
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "FETCH_DATE=${{ inputs.date }}" >> $GITHUB_ENV
            npm run index -- --date ${{ inputs.date }}
          else
            echo "FETCH_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV
            npm run index
          fi
      - run: git config --local user.email "github-actions[bot]@github.com"
      - run: git config --local user.name "github-actions[bot]"
      - run: git add .
      # 完整性门槛: 当天 <10 条视为央视未发布完, 不提交 (Worker 下一轮重试)
      # 历史补数据不受此限
      - name: Commit if new content is complete
        run: |
          F="news/${FETCH_DATE}.md"
          if [ -f "$F" ]; then
            COUNT=$(grep -c '^### ' "$F" || true)
            TODAY=$(TZ=Asia/Shanghai date +%Y%m%d)
            echo "新闻条数: $COUNT (日期 $FETCH_DATE)"
            if [ "$FETCH_DATE" = "$TODAY" ] && [ "$COUNT" -lt 10 ]; then
              echo "当天内容不完整(<10条), 本次不提交"
              echo "HAS_CHANGES=false" >> $GITHUB_ENV
              exit 0
            fi
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "AUTO UPDATE [bot]"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi
      - name: Push master changes
        if: env.HAS_CHANGES == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
