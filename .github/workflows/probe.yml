name: URL probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          URL="http://tv.cctv.com/2026/08/23/VIDEGRz6h83RC5PzcHNtlX0c260823.shtml"
          echo "URL=$URL"
          echo "--- curl HTTP ChromeUA ---"
          curl -s --max-time 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36" "$URL" -o p1.html -w "size=%{size_download}\n"
          grep -c "央视网消息" p1.html || echo "0 无正文"
          echo "--- node fetch bare ---"
          node -e "fetch('$URL').then(r=>r.text()).then(t=>console.log('size='+t.length,'body='+(t.includes('央视网消息')?'YES':'NO')))"
